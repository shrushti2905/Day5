<!DOCTYPE html>
<html>
<head>
    <title>YouTube</title>
    <link rel="stylesheet" href="16c.css">
</head>

<body>

<div class="video-grid">

    <div class="video-preview">

        <!-- Thumbnail is now a link -->
        <div>
            <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
               target="_blank">

                <img class="thumbnail"
                     src="thumbnail.jpg">

            </a>
        </div>

        <div class="video-info">

            <!-- Channel picture is now a link -->
            <div class="channel-picture">

                <a href="https://www.youtube.com/@mkbhd"
                   target="_blank">

                    <img class="profile-picture"
                         src="profile.jpg">

                </a>

            </div>

            <div class="video-text">

                <!-- Video title link -->
                <a href="https://www.youtube.com/watch?v=n2RNcPRtAiY"
                   target="_blank"
                   class="video-title-link">

                    <p class="video-title">
                        Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>

                </a>

                <p class="video-author">
                    Marques Brownlee
                </p>

                <p class="video-stats">
                    3.4M views · 6 months ago
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
